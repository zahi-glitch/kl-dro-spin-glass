[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tapdual"
version = "0.1.0"
description = "KL-constrained DRO meets spin glasses: primal sup and Parisi inf for REM-type approximations of TAP free energies"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "scipy>=1.8"]

[project.optional-dependencies]
test = ["pytest>=7"]
app = ["PySide6>=6.6", "pyqtgraph>=0.13", "matplotlib>=3.5"]
backtest = ["pandas>=1.5", "matplotlib>=3.5", "cvxpy>=1.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tapdual = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
