# Every weekday after the US market close: follow the virtual $10,000 and, once a month,
# save the paper-trading weights. Results are committed to paper_trading/.
# Run it by hand from the Actions tab ("Run workflow"). Educational, no real money.
name: paper trading

on:
  schedule:
    - cron: "30 22 * * 1-5"      # 22:30 UTC, Monday to Friday
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[live]"
      - name: Track
        run: python scripts/track.py
      - name: Commit the results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper_trading
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "paper trading: update $(date -u +%F)"
          git push
